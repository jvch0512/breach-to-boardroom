name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - name: Sample brief is up to date
        run: |
          node dist/src/cli.js examples/win-security.jsonl examples/auth.log examples/access.log --year 2026 > /tmp/b.md || test $? -eq 1
          diff /tmp/b.md docs/sample-brief.md
